var D={"fr": {"title": "L'Horloger de Vauclair", "tagline": "Treize coups ont sonné. Il n'aurait dû en sonner que douze.", "synopsis": "Novembre 1893. Un horloger vous convoque une nuit à Vauclair, une petite ville où toutes les horloges sonnent treize coups. Vous avez huit heures avant l'aube pour comprendre ce que cache la maison Verdier, et décider ce que vaut le temps. Chaque pièce que vous explorez vous coûte une heure : on ne peut pas tout voir.", "info": "Enquête fantastique · environ 1 h 30 · 8 fins", "items": {"lanterne": "Lanterne sourde", "trousse": "Trousse d'horloger", "loupe": "Loupe de bijoutier", "marteau": "Marteau de fonderie", "cle_cave": "Clef de la cave", "medaillon": "Médaillon d'Élise", "cle_regleur": "Clef de régleur"}, "p": {"debut": {"place": "Vauclair, rue des Horlogers", "paras": ["Novembre 1893. La diligence vous dépose au bout de la rue des Horlogers, dans un brouillard qui sent la suie et l'huile froide. Il est dix heures du soir. Le cocher ne descend pas de son siège ; il refuse même de regarder la maison.", "— Vous avez de la chance, monsieur : à Vauclair, la nuit dure plus longtemps qu'ailleurs.", "Il fouette ses chevaux et disparaît. Vous restez seul avec votre malle de restaurateur d'automates et une lettre pliée en quatre.", "Au-dessus des toits, le cadran de la Tour des Quatre Cadrans indique trois heures dix-sept. Il se trompe, évidemment. Pourtant, quelque chose en vous voudrait croire qu'il ne se trompe pas.", "La maison de l'horloger Anselme Verdier se dresse devant vous : haute, étroite, toutes fenêtres éteintes sauf une, tout en haut."], "clips": ["b6b33f615787", "027be7a1a248", "61621833a165", "f67ecdec0a8d", "3fdcfa737626"], "fx": ["+item:lanterne", "+item:trousse"], "choices": [{"t": "Relire la lettre à la lumière de votre lanterne.", "to": "lettre"}, {"t": "Frapper à la porte.", "to": "porte"}]}, "lettre": {"place": "Vauclair, rue des Horlogers", "paras": ["Vous dépliez la lettre. Elle est arrivée à votre atelier de Lyon il y a trois jours, avec un mandat de voyage et cinquante francs d'avance.", "« Monsieur, on me dit que vous savez réparer ce que d'autres jettent. J'ai un mécanisme qui ne doit pas s'arrêter et qui n'a plus que quelques heures à vivre. Venez avant minuit. N'écoutez pas les coups. — A. Verdier »", "Vous l'aviez déjà lue vingt fois. Mais ce soir, sous la flamme, un détail vous saute aux yeux. La signature est ferme, anguleuse, celle d'un homme qui a l'habitude de commander. Le corps de la lettre, lui, est tracé d'une main ronde et appliquée, avec des « l » bouclés et des « t » qui ne sont jamais barrés jusqu'au bout.", "Une écriture d'écolière."], "clips": ["e19216e0df13", "cdfb808cdd4e", "d1a8c58a4260", "fec4152965e3"], "fx": ["+clue:lettre_ecriture"], "choices": [{"t": "Ranger la lettre et frapper à la porte.", "to": "porte"}, {"t": "Pénétrer dans le vestibule.", "to": "hall"}]}, "porte": {"place": "Maison Verdier", "paras": ["Vous n'avez pas fini de lever le poing que la porte s'ouvre. Une femme se tient dans l'entrebâillement, un bougeoir à la main. Elle porte le tablier d'une gouvernante, mais sous le bonnet ses cheveux sont d'un blanc de cire et son visage est creusé comme celui d'une très vieille dame. Seul son regard est jeune.", "— Madame Odile, dit-elle. Monsieur vous attendait. Entrez vite, avant qu'on vous voie. Il est descendu à la cave à midi et a demandé qu'on ne le dérange sous aucun prétexte. Il a dit que vous sauriez quoi faire.", "Elle referme derrière vous et pousse trois verrous.", "— Une dernière chose, monsieur. À minuit, la maison sonne. Ne comptez pas les coups. Ça ne fait de bien à personne."], "clips": ["79abf906c0de", "c7c5d4b24faf", "e00b1c3e14fa", "3da912d6734b"], "fx": [], "choices": [{"t": "Pénétrer dans le vestibule.", "to": "hall"}, {"t": "Entrer dans le salon.", "to": "fin"}]}, "hall": {"place": "Le vestibule", "paras": ["Le vestibule est une forêt d'horloges. Il y en a au mur, sur les consoles, jusque dans les coins du plafond : des comtoises, des pendules de marbre, des régulateurs à poids, des coucous. Vous en comptez treize. Toutes battent, et pas deux au même rythme, comme une pluie qui hésite.", "Pourtant, toutes marquent la même heure.", "Un escalier de chêne monte vers l'étage. À gauche, la porte du salon ; à droite, celle de l'atelier. Au fond, derrière un rideau, la porte basse de la cave, et plus loin la cuisine où Madame Odile s'est retirée. Une porte vitrée donne sur le jardin et sur la Tour des Quatre Cadrans, qui se découpe dans la brume."], "clips": ["1a4400cdbf53", "17b44a13705f", "ca538b3b6b0b"], "fx": [], "choices": [{"t": "Examiner de près les horloges.", "to": "fin"}, {"t": "Entrer dans le salon.", "to": "fin"}, {"t": "Pousser la porte de l'atelier.", "to": "fin"}, {"t": "Monter à l'étage.", "to": "fin"}, {"t": "Aller trouver Madame Odile à la cuisine.", "to": "fin"}, {"t": "Sortir par la porte vitrée, vers le jardin et la tour.", "to": "fin"}, {"t": "Écarter le rideau et tenter la porte de la cave.", "to": "fin"}, {"t": "Renoncer. Quitter cette maison et rejoindre la gare à pied.", "to": "fin"}]}}}, "en": {"title": "The Clockmaker of Vauclair", "tagline": "Thirteen strokes rang out. There should only have been twelve.", "synopsis": "November 1893. A clockmaker summons you one night to Vauclair, a small town where every clock strikes thirteen. You have eight hours before dawn to understand what the Verdier house is hiding, and to decide what time is worth. Every room you explore costs you an hour: you cannot see everything.", "info": "Fantasy mystery · about 1 h 30 · 8 endings", "items": {"lanterne": "Dark lantern", "trousse": "Clockmaker's kit", "loupe": "Jeweler's loupe", "marteau": "Foundry hammer", "cle_cave": "Cellar key", "medaillon": "Élise's locket", "cle_regleur": "Regulator's key"}, "p": {"debut": {"place": "Vauclair, Clockmakers' Street", "paras": ["November 1893. The coach drops you at the end of Clockmakers' Street, in a fog that smells of soot and cold oil. It is ten o'clock at night. The driver does not climb down from his seat; he will not even look at the house.", "\"You're lucky, sir: in Vauclair, the night lasts longer than anywhere else.\"", "He whips his horses and vanishes. You are left alone with your automaton restorer's trunk and a letter folded in four.", "Above the rooftops, the dial of the Tower of the Four Dials shows seventeen minutes past three. It is wrong, of course. And yet something in you would like to believe it is not.", "The house of the clockmaker Anselme Verdier stands before you: tall, narrow, every window dark but one, at the very top."], "clips": ["685b0096b5f8", "7602574d2982", "b8b8af97c8df", "3c4bc3fbf6c1", "52fa43c106fa"], "fx": ["+item:lanterne", "+item:trousse"], "choices": [{"t": "Reread the letter by the light of your lantern.", "to": "lettre"}, {"t": "Knock on the door.", "to": "porte"}]}, "lettre": {"place": "Vauclair, Clockmakers' Street", "paras": ["You unfold the letter. It reached your workshop in Lyon three days ago, with a travel voucher and fifty francs in advance.", "\"Sir, I am told you can repair what others throw away. I have a mechanism that must not stop and has only a few hours left to live. Come before midnight. Do not listen to the strokes. — A. Verdier\"", "You have already read it twenty times. But tonight, under the flame, a detail leaps out at you. The signature is firm, angular, that of a man used to giving orders. The body of the letter, however, is traced in a round, careful hand, with looped \"l\"s and \"t\"s that are never crossed all the way.", "A schoolgirl's handwriting."], "clips": ["654f74830143", "c090d4cbaffc", "c8c3797170db", "1b5a28b370f6"], "fx": ["+clue:lettre_ecriture"], "choices": [{"t": "Put the letter away and knock on the door.", "to": "porte"}, {"t": "Step into the hall.", "to": "hall"}]}, "porte": {"place": "Verdier House", "paras": ["You have not finished raising your fist when the door opens. A woman stands in the doorway, a candlestick in her hand. She wears a housekeeper's apron, but under the cap her hair is waxen white and her face is hollowed like that of a very old lady. Only her gaze is young.", "\"Madame Odile,\" she says. \"The master was expecting you. Come in quickly, before you're seen. He went down to the cellar at noon and asked not to be disturbed under any circumstances. He said you would know what to do.\"", "She closes the door behind you and slides three bolts.", "\"One last thing, sir. At midnight, the house strikes. Don't count the strokes. It does nobody any good.\""], "clips": ["8f2b76de5e5f", "a5b9f7ee7ebb", "25f62aa872eb", "85743a68fafc"], "fx": [], "choices": [{"t": "Step into the hall.", "to": "hall"}, {"t": "Enter the parlor.", "to": "fin"}]}, "hall": {"place": "The hall", "paras": ["The hall is a forest of clocks. They hang on the walls, stand on the consoles, even sit in the corners of the ceiling: longcase clocks, marble clocks, weight-driven regulators, cuckoos. You count thirteen. All of them tick, and no two at the same rhythm, like rain that cannot make up its mind.", "And yet they all show the same hour.", "An oak staircase climbs to the upper floor. On the left, the door of the parlor; on the right, that of the workshop. At the back, behind a curtain, the low door to the cellar, and farther on the kitchen where Madame Odile has retired. A glass door opens onto the garden and onto the Tower of the Four Dials, which stands out in the mist."], "clips": ["a0b46ef5ed42", "527bf9abc506", "0b8960493714"], "fx": [], "choices": [{"t": "Examine the clocks up close.", "to": "fin"}, {"t": "Enter the parlor.", "to": "fin"}, {"t": "Push open the workshop door.", "to": "fin"}, {"t": "Go upstairs.", "to": "fin"}, {"t": "Go and find Madame Odile in the kitchen.", "to": "fin"}, {"t": "Go out through the glass door, toward the garden and the tower.", "to": "fin"}, {"t": "Pull back the curtain and try the cellar door.", "to": "fin"}, {"t": "Give up. Leave this house and walk to the station.", "to": "fin"}]}}}};
